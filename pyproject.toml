[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otcli"
version = "1.0.0a2"
description = "Odoo Tasks CLI: automate backup, restore and upgrade of Odoo databases."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Héctor Aular", email = "aular.hector.dev@gmail.com" },
]
keywords = ["odoo", "backup", "restore", "upgrade", "postgres", "docker", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]
dependencies = [
    "docker>=6.1,<8",
    "typer>=0.9.0",
    "toml>=0.10.2",
    "tomli-w>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit",
    "build",
]

[project.urls]
"Homepage" = "https://github.com/haular/odoo_cli_tool"
"Bug Tracker" = "https://github.com/haular/odoo_cli_tool/issues"
"Changelog" = "https://github.com/haular/odoo_cli_tool/blob/main/CHANGELOG.md"

[project.scripts]
otcli = "otcli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otcli = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 126
fix = true

[tool.ruff.lint]
extend-select = ["F", "B", "C90", "E501", "I", "UP", "SIM", "RET", "RUF"]
extend-safe-fixes = ["UP008"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"__manifest__.py" = ["B018"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "odoo", "odoo-addons", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"odoo" = ["odoo"]
"odoo-addons" = ["odoo.addons"]

[tool.mypy]
python_version = "3.12"
files = ["src/otcli"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
