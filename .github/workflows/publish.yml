name: Publish

# Triggered by pushing a tag like v1.0.0a1, v1.0.0, etc.
# Uses PyPI Trusted Publishing (OIDC) — no API token in repo secrets.
# Configure the trusted publisher at https://pypi.org/manage/account/publishing/
# pointing to repo haular/odoo_cli_tool, workflow publish.yml,
# environment 'pypi'.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/otcli
    permissions:
      id-token: write       # required for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install build deps
        run: uv pip install --system build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
